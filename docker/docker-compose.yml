# Haul — BitTorrent client
# https://beaconstack.io/haul
#
#   1. Set the two host paths below.
#   2. docker compose -f docker/docker-compose.yml up -d
#   3. Open http://<this-host>:8484
#
# To use Haul from Pilot or Prism, add it as a download client there:
#   URL:     http://<this-host>:8484
#   API key: Haul → Settings
# Pilot sends category "tv" and Prism "movies", so downloads land in
# /data/torrents/tv and /data/torrents/movies. More examples that connect
# the apps: https://beaconstack.io

services:
  haul:
    image: ghcr.io/beacon-stack/haul:latest
    container_name: haul
    restart: unless-stopped
    ports:
      - "8484:8484"                 # web UI and API
      - "6881:6881/tcp"             # BitTorrent peers; forward this port on
      - "6881:6881/udp"             # your router for better speeds
    environment:
      TZ: UTC                       # your timezone, e.g. America/New_York

      # Torrents are saved in <this folder>/<category>. Change it here or
      # in Settings → Downloads (the setting there wins). A category can
      # also have its own folder, e.g. a NAS share.
      HAUL_TORRENT_DOWNLOAD_DIR: /data/torrents

      # Optional: connect to Pulse
      # Haul registers itself with Pulse, which then hands it to Pilot and
      # Prism as their download client, so you don't add it by hand. To
      # turn it on, set the URL and uncomment the two lines below it.
      HAUL_PULSE_URL: ""                          # e.g. http://192.168.1.10:9696
      # HAUL_PULSE_API_KEY: <Pulse's API key>     # Pulse → Settings
      # ADVERTISE_HOST: 192.168.1.10              # this host's address, so
      #                                           # Pilot/Prism can reach Haul
    volumes:
      # Haul's database and settings. Keep it on a local disk.
      - /path/to/config/haul:/config

      # Your media and downloads, in ONE folder: the same folder you give
      # Pilot and Prism at /data, so their imports are instant hardlinks.
      # The folder must be writable by uid 1000.
      - /path/to/data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8484/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
