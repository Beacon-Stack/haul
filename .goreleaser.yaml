# GoReleaser config for Haul
# https://goreleaser.com
#
# Triggered from .github/workflows/release.yml on `v*` tag pushes.
# Builds cross-platform binaries, archives them and publishes a GitHub
# Release. Images are built by the docker job in release.yml, from the
# same Dockerfile CI uses: GoReleaser's own image step builds from a
# folder holding only the binary, which the from-source Dockerfile
# can't use (why the v0.2.0 and v0.3.0 Pulse releases failed).

version: 2

project_name: haul

before:
  hooks:
    - go mod download
    - sh -c "cd web/ui && npm ci && npm run build"

builds:
  - id: haul
    main: ./cmd/haul
    binary: haul
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/beacon-stack/haul/internal/version.Version={{.Version}}
      - -X github.com/beacon-stack/haul/internal/version.BuildTime={{.Date}}

archives:
  - id: haul
    ids: [haul]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - config.example.yaml

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^chore:'
      - '^test:'
      - '^ci:'
      - '(?i)merge pull request'

release:
  github:
    owner: beacon-stack
    name: haul
  draft: false
  prerelease: auto
  name_template: 'v{{ .Version }}'
